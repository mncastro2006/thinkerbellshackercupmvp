version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: thinkerbells-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-thinkerbells}
      MYSQL_USER: ${MYSQL_USER:-thinkerbells}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-thinkerbells}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - thinkerbells-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thinkerbells-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-thinkerbells}
      DB_USER: ${MYSQL_USER:-thinkerbells}
      DB_PASSWORD: ${MYSQL_PASSWORD:-thinkerbells}
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - thinkerbells-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    container_name: thinkerbells-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - thinkerbells-net

  adminer:
    image: adminer:latest
    container_name: thinkerbells-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - thinkerbells-net

volumes:
  mysql_data:
  backend_uploads:

networks:
  thinkerbells-net:
    driver: bridge
